<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />

    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js"></script>

    <title>Flip the coin | devChallenges.io</title>

    <!--You are welcome to delete these styles or modify them in your own stylesheet -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        background-color: rgb(64, 64, 101);
      }

      .author-info {
        font-size: 20px;
        text-align: center;
        margin-top: 6.5rem;
        color: rgb(55, 65, 81);
        background-color: white;
        border-radius: 10px;
        width: 33rem;
        margin-left: auto;
        margin-right: auto;
        padding: 10px 0;
        font-weight: bold;
      }

      .author-info a {
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="head">
        <h1>Flip the coin</h1>
        <h2>Press the coin or the button to flip the coin</h2>
      </header>

      <section class="coin">
        <img src="resources/heads.svg" alt="" />
      </section>
      <section class="shadow">
        <img src="/resources/shadow.svg" alt="" />
      </section>

      <section class="result">
        <h3>Heads</h3>
      </section>

      <button class="btn">RANDOM</button>
    </div>
    <!-- 

    Flip a Coin Game
    Press the coin or the button to flip the coin
    Head
    Tail
    Random
  
    -->

    <div class="author-info">
      Coded by <a href="#">Abdullah Aman</a> | Challenge by
      <a href="https://www.devchallenges.io?ref=challenge" target="_blank"
        >devChallenges.io</a
      >.
    </div>
  </body>
</html>
